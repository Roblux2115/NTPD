name: Lab06 ML Tests and Docker Build

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalacja zależności
        run: |
          cd lab06
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchomienie testów
        run: |
          cd lab06
          pytest

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Logowanie do GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Budowanie i publikacja obrazu Docker
        uses: docker/build-push-action@v6
        with:
          context: ./lab06
          push: true
          tags: ghcr.io/roblux2115/ntpd-lab06:latest